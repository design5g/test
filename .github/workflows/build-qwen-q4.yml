name: Build Compact Qwen Q4 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate V5 source
        shell: bash
        run: |
          set -euxo pipefail
          cat water-build/chunk_*.b64 > ishrab_v3.tar.gz.b64
          base64 -d ishrab_v3.tar.gz.b64 > ishrab_v3.tar.gz
          gzip -t ishrab_v3.tar.gz
          tar -xzf ishrab_v3.tar.gz
          patch -p1 -d ishrab_v3 < water-build/v3-fix.patch

          cat water-build/v4fix06hex_0.txt water-build/v4fix06hex_1.txt | tr -d '\r\n ' | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' > corrected-06.b64
          test "$(wc -c < corrected-06.b64)" = "4000"
          : > v4-ai.patch.gz.b64
          for i in $(seq -w 0 19); do
            f="water-build/v4ai_${i}.b64"
            if [ "$i" = "06" ]; then f="corrected-06.b64"; fi
            tr -d '\r\n ' < "$f" >> v4-ai.patch.gz.b64
          done
          test "$(wc -c < v4-ai.patch.gz.b64)" = "76216"
          base64 -d v4-ai.patch.gz.b64 > v4-ai.patch.gz
          gzip -t v4-ai.patch.gz
          gzip -dc v4-ai.patch.gz > v4-ai.patch
          test "$(sha256sum v4-ai.patch | awk '{print $1}')" = "5522d79bed4abd2fd8ad784546ccc937ffb0da6780f39b589fd968118f00fb24"
          patch -p1 -d ishrab_v3 < v4-ai.patch

          cat water-build-v5/v5rel_*.b64 | tr -d '\r\n ' > v5.patch.gz.b64
          test "$(wc -c < v5.patch.gz.b64)" = "18324"
          test "$(sha256sum v5.patch.gz.b64 | awk '{print $1}')" = "ebd69d994e4287c313db135822670a0d5291c33c06e6ee2087e082597a95c2bf"
          base64 -d v5.patch.gz.b64 > v5.patch.gz
          gzip -t v5.patch.gz
          gzip -dc v5.patch.gz > v5.patch
          test "$(sha256sum v5.patch | awk '{print $1}')" = "f74a387d340fe47a2ae64edb7200fcb50445122b70ecf19e96b7aef30b00be11"
          patch -p1 -d ishrab_v3 < v5.patch
          test -f ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          test -f ishrab_v3/app/src/main/cpp/CMakeLists.txt

      - name: Fetch pinned llama.cpp
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ishrab_v3/app/llama.cpp
          git -C ishrab_v3/app/llama.cpp init
          git -C ishrab_v3/app/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C ishrab_v3/app/llama.cpp fetch --depth 1 origin 6eddde06a4f25d55d538b5d15628dcc2b6882147
          git -C ishrab_v3/app/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C ishrab_v3/app/llama.cpp rev-parse HEAD)" = "6eddde06a4f25d55d538b5d15628dcc2b6882147"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h')
          s = p.read_text()
          old = '''static inline int ai_should_log(int prio) {
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          }'''
          new = '''static inline int ai_should_log(int prio) {
          #if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif
          }'''
          if old not in s:
              raise SystemExit('Expected llama.cpp logging function was not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Download official Qwen Q8 source model
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '1200'
          HF_HUB_ETAG_TIMEOUT: '60'
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --quiet "huggingface_hub>=0.33"
          ASSET_DIR="$GITHUB_WORKSPACE/ishrab_v3/app/src/main/assets"
          MODEL="$ASSET_DIR/Qwen3-0.6B-Q8_0.gguf"
          mkdir -p "$ASSET_DIR"
          python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          print(hf_hub_download(
              repo_id='Qwen/Qwen3-0.6B-GGUF',
              filename='Qwen3-0.6B-Q8_0.gguf',
              local_dir='ishrab_v3/app/src/main/assets',
              force_download=True,
          ))
          PY
          test -f "$MODEL"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"
          test "$(stat -c%s "$MODEL")" = "639446688"
          test ! -d "${MODEL}.parts"

      - name: Quantize model to Q4_K_M and patch app
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S ishrab_v3/app/llama.cpp -B llama-host-build \
            -DLLAMA_CURL=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF
          cmake --build llama-host-build --target llama-quantize -j2

          ASSET_DIR="$GITHUB_WORKSPACE/ishrab_v3/app/src/main/assets"
          INPUT="$ASSET_DIR/Qwen3-0.6B-Q8_0.gguf"
          OUTPUT="$ASSET_DIR/Qwen3-0.6B-Q4_K_M.gguf"
          llama-host-build/bin/llama-quantize "$INPUT" "$OUTPUT" Q4_K_M
          test -f "$OUTPUT"
          size=$(stat -c%s "$OUTPUT")
          sha=$(sha256sum "$OUTPUT" | awk '{print $1}')
          test "$size" -gt 300000000
          test "$size" -lt 520000000
          rm -f "$INPUT"

          python3 - "$sha" "$size" <<'PY'
          from pathlib import Path
          import sys
          sha, size = sys.argv[1], sys.argv[2]
          p = Path('ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java')
          s = p.read_text()
          s = s.replace('Qwen3-0.6B-Q8_0.gguf', 'Qwen3-0.6B-Q4_K_M.gguf')
          s = s.replace('9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031', sha)
          s = s.replace('Qwen3‑0.6B Q8_0', 'Qwen3‑0.6B Q4_K_M')
          s = s.replace('model.length() > 600_000_000L', 'model.length() > 300_000_000L')
          s = s.replace('670_000_000L', size + 'L')
          if 'Qwen3-0.6B-Q8_0.gguf' in s:
              raise SystemExit('Old model filename remains')
          p.write_text(s)
          PY

          echo "MODEL_SHA=$sha" >> "$GITHUB_ENV"
          echo "MODEL_SIZE=$size" >> "$GITHUB_ENV"
          echo "MODEL_FILE=Qwen3-0.6B-Q4_K_M.gguf" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$sha" "Qwen3-0.6B-Q4_K_M.gguf" > q4-model.sha256
          printf '%s\n' "$size" > q4-model.size
          ls -lh "$OUTPUT"

      - name: Set up Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/smart-health-qwen-q4.jks" -storepass SmartQwenQ4_2026X -alias smartqwenq4 -keypass SmartQwenQ4_2026X -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ishrab Smart Health Qwen Q4,O=Local,C=JO"

      - name: Build signed compact APK
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/smart-health-qwen-q4.jks
          SIGN_STORE_PASSWORD: SmartQwenQ4_2026X
          SIGN_KEY_ALIAS: smartqwenq4
          SIGN_KEY_PASSWORD: SmartQwenQ4_2026X
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5120m
        run: |
          set -euxo pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-q4.log"

      - name: Verify compact APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="ishrab_v3/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "assets/$MODEL_FILE"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libai-chat.so"
          unzip -p "$APK" "assets/$MODEL_FILE" | sha256sum | grep -F "$MODEL_SHA"
          apk_size=$(stat -c%s "$APK")
          test "$apk_size" -lt 536870912
          sha256sum "$APK" > compact-apk.sha256
          stat -c '%s' "$APK" > compact-apk.size
          ls -lh "$APK"

      - name: Upload compact Qwen APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-qwen-q4-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-qwen-q4-metadata
          path: |
            compact-apk.sha256
            compact-apk.size
            q4-model.sha256
            q4-model.size
          if-no-files-found: error
          retention-days: 7
