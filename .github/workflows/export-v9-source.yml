name: Export MNN V9 Source

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct V9 source
        shell: bash
        run: |
          set -euxo pipefail
          cat water-build-v9/v9patch_0?.b64 | tr -d '\r\n ' > v9.patch.gz.b64
          base64 -d v9.patch.gz.b64 > v9.patch.gz
          gzip -t v9.patch.gz
          gzip -dc v9.patch.gz > v9.patch
          bash water-build-v7/prepare_v7.sh
          patch -p1 -d ishrab_v3 < v9.patch
          tar -czf ishrab-v9-source.tar.gz ishrab_v3
          sha256sum ishrab-v9-source.tar.gz > ishrab-v9-source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ishrab-v9-source
          path: |
            ishrab-v9-source.tar.gz
            ishrab-v9-source.sha256
          compression-level: 0
          retention-days: 3