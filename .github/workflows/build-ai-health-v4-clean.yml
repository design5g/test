name: Build Ishrab AI Health V4 Clean

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified source package
        shell: bash
        run: |
          set -euo pipefail
          for f in ai-v4-build/chunk_*.b64; do
            LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$f"
          done > aiapp-v4.tar.gz.b64
          test "$(wc -c < aiapp-v4.tar.gz.b64)" -eq 24488
          base64 -d aiapp-v4.tar.gz.b64 > aiapp-v4.tar.gz
          echo '811e6f2f417964601f0bf153ffd9da7c0590ae2ac01ffe4af0b8a38f3636498a  aiapp-v4.tar.gz' | sha256sum -c -
          gzip -t aiapp-v4.tar.gz
          tar -xzf aiapp-v4.tar.gz
          test -f aiapp/app/build.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build signed release APK
        id: build
        continue-on-error: true
        working-directory: aiapp
        shell: bash
        run: |
          set -o pipefail
          PASS="$(openssl rand -hex 16)"
          KEYSTORE="$GITHUB_WORKSPACE/ai-v4-release.jks"
          keytool -genkeypair -keystore "$KEYSTORE" -storepass "$PASS" -alias aihealth -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ishrab Smart AI,O=Local,C=JO" >/dev/null 2>&1
          export SIGN_STORE_FILE="$KEYSTORE"
          export SIGN_STORE_PASSWORD="$PASS"
          export SIGN_KEY_ALIAS="aihealth"
          export SIGN_KEY_PASSWORD="$PASS"
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/ai-v4-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-v4-clean-build-log
          path: ai-v4-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after compilation failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature and archive
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs aiapp/app/build/outputs/apk/release/app-release.apk
          unzip -t aiapp/app/build/outputs/apk/release/app-release.apk
          sha256sum aiapp/app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ishrab-ai-health-v4-clean-apk
          path: aiapp/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
