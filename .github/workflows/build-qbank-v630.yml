name: Build Qbank V6.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qbank-v630.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified Android source
        run: |
          cat build/qbank-v630-min.part-* > /tmp/qbank-source.b64
          base64 -d /tmp/qbank-source.b64 > /tmp/qbank-source.zip
          echo "d84b6b873c471b34e8d4e7aa7184871c49c449bf8b770e7f5b892c159a3a2f8b  /tmp/qbank-source.zip" | sha256sum -c -
          mkdir -p /tmp/qbank
          unzip -q /tmp/qbank-source.zip -d /tmp/qbank
          test -f /tmp/qbank/Android-Source/app/build.gradle.kts

      - name: Permit unsigned CI package
        working-directory: /tmp/qbank/Android-Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = 'if (releaseArtifactRequested) require(releaseSigningReady) {'
          new = 'if (releaseArtifactRequested && System.getenv("QBANK_CI_UNSIGNED") != "1") require(releaseSigningReady) {'
          if old not in text:
              raise SystemExit('Expected release-signing guard was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build unsigned release APK
        working-directory: /tmp/qbank/Android-Source
        env:
          QBANK_CI_UNSIGNED: '1'
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PQBANK_API_BASE_URL="https://jokerx.shop/api/mobile.php?action=" \
            -PQBANK_SITE_NAME="Qbank"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -ls

      - name: Verify APK metadata
        run: |
          APK=$(find /tmp/qbank/Android-Source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          sha256sum "$APK" | tee /tmp/apk-sha256.txt
          cp "$APK" /tmp/Qbank-V5-6.3.0-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v630-unsigned
          path: |
            /tmp/Qbank-V5-6.3.0-unsigned.apk
            /tmp/apk-badging.txt
            /tmp/apk-sha256.txt
          retention-days: 1
          if-no-files-found: error
