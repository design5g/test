name: Build Qbank V6.3.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-qbank-v630.yml'
  pull_request:
    branches: [main]
    paths:
      - 'trigger-qbank-build.txt'
      - '.github/workflows/build-qbank-v630.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore verified Android source
        run: |
          cat build/qbank-v630-min.part-* > /tmp/qbank-source.b64
          base64 -d /tmp/qbank-source.b64 > /tmp/qbank-source.zip
          echo "bac3750afc1fc3448b84cbbdf1edd81ad0de7bcc86d249860eb34dd499a15cf6  /tmp/qbank-source.zip" | sha256sum -c -
          mkdir -p /tmp/qbank
          unzip -q /tmp/qbank-source.zip -d /tmp/qbank
          test -f /tmp/qbank/Android-Source/app/build.gradle.kts

      - name: Permit unsigned CI package
        working-directory: /tmp/qbank/Android-Source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/build.gradle.kts')
          text = path.read_text()
          old = 'if (releaseArtifactRequested) require(releaseSigningReady) {'
          new = 'if (releaseArtifactRequested && System.getenv("QBANK_CI_UNSIGNED") != "1") require(releaseSigningReady) {'
          if old not in text:
              raise SystemExit('Expected release-signing guard was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build unsigned release APK
        id: apk_build
        continue-on-error: true
        working-directory: /tmp/qbank/Android-Source
        env:
          QBANK_CI_UNSIGNED: '1'
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --stacktrace --no-daemon \
            -PQBANK_API_BASE_URL="https://jokerx.shop/api/mobile.php?action=" \
            -PQBANK_SITE_NAME="Qbank" 2>&1 | tee /tmp/qbank-build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "$BUILD_EXIT" > /tmp/qbank-build-exit.txt
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -ls 2>/dev/null || true
          exit "$BUILD_EXIT"

      - name: Verify APK metadata
        if: steps.apk_build.outcome == 'success'
        run: |
          APK=$(find /tmp/qbank/Android-Source/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          sha256sum "$APK" | tee /tmp/apk-sha256.txt
          cp "$APK" /tmp/Qbank-V5-6.3.0-unsigned.apk

      - name: Upload unsigned APK artifact
        if: steps.apk_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qbank-v630-unsigned
          path: |
            /tmp/Qbank-V5-6.3.0-unsigned.apk
            /tmp/apk-badging.txt
            /tmp/apk-sha256.txt
          retention-days: 1
          if-no-files-found: error

      - name: Publish build result
        if: always()
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          rm -rf output/qbank-v630
          mkdir -p output/qbank-v630
          cp /tmp/qbank-build.log output/qbank-v630/build.log 2>/dev/null || true
          cp /tmp/qbank-build-exit.txt output/qbank-v630/build-exit.txt 2>/dev/null || printf '%s\n' 'setup-failed' > output/qbank-v630/build-exit.txt
          if [ -f /tmp/Qbank-V5-6.3.0-unsigned.apk ]; then
            base64 -w0 /tmp/Qbank-V5-6.3.0-unsigned.apk | split -b 700000 -d -a 3 - output/qbank-v630/apk.part-
            cp /tmp/apk-badging.txt output/qbank-v630/
            cp /tmp/apk-sha256.txt output/qbank-v630/
            printf '%s\n' 'Concatenate apk.part-* in lexical order, base64-decode, then verify apk-sha256.txt.' > output/qbank-v630/README.txt
          else
            printf '%s\n' 'The APK build failed. See build.log and build-exit.txt.' > output/qbank-v630/README.txt
          fi
          git config user.name 'qbank-build-bot'
          git config user.email 'qbank-build-bot@users.noreply.github.com'
          git add output/qbank-v630
          git commit -m 'Publish Qbank 6.3.0 build result [skip ci]' || exit 0
          git push origin HEAD:"$TARGET_BRANCH"
