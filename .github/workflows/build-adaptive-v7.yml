name: Build Adaptive Health AI V7 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recreate V7 source
        shell: bash
        run: |
          set -euxo pipefail
          bash water-build-v7/prepare_v7.sh 2>&1 | tee prepare-v7.log
          test -f ishrab_v3/app/src/main/assets/local_health_ai_v2.json
          python3 - <<'PY'
          import json
          p='ishrab_v3/app/src/main/assets/local_health_ai_v2.json'
          m=json.load(open(p))
          assert m['training_examples']==10000
          assert m['intent_count']==20
          assert m['learning']['persistent_memory'] is True
          assert m['learning']['automatic_forgetting'] is False
          print('V6 adaptive intent model retained:', m['training_examples'], m['validation_accuracy'])
          PY

      - name: Fetch pinned MedQuAD
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/abachaa/MedQuAD.git medquad
          git -C medquad fetch --depth 1 origin 577bd37b96c02d1833b2c9eed2de9f96964e96cb
          git -C medquad checkout --detach FETCH_HEAD
          test "$(git -C medquad rev-parse HEAD)" = "577bd37b96c02d1833b2c9eed2de9f96964e96cb"

      - name: Build and audit 100000 evidence units
        shell: bash
        run: |
          set -euxo pipefail
          DB='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          python3 water-build-v7/build_medical_knowledge.py medquad "$DB" | tee knowledge-v7.log
          python3 - <<'PY'
          import json, sqlite3
          db='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          con=sqlite3.connect(db)
          assert con.execute('select count(*) from knowledge').fetchone()[0] == 100000
          assert con.execute('select count(*) from knowledge_fts').fetchone()[0] == 100000
          meta=dict(con.execute('select key,value from metadata'))
          assert meta['knowledge_count']=='100000'
          assert meta['dataset']=='MedQuAD'
          assert meta['dataset_license']=='CC BY 4.0'
          rows=con.execute("select k.source,k.focus,k.evidence from knowledge_fts f join knowledge k on k.id=f.docid where knowledge_fts match 'diabetes OR glucose' limit 8").fetchall()
          assert rows and all(r[0] and r[2] for r in rows)
          print('knowledge audit passed', meta)
          print('sample retrieval rows', len(rows), rows[0][0], rows[0][1])
          con.close()
          report=json.load(open(db+'.metadata.json'))
          assert report['knowledge_count']=='100000'
          PY
          sha256sum "$DB" > knowledge-db.sha256
          stat -c '%s' "$DB" > knowledge-db.size
          ls -lh "$DB"

      - name: Fetch pinned llama.cpp Android runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ishrab_v3/app/llama.cpp
          git -C ishrab_v3/app/llama.cpp init
          git -C ishrab_v3/app/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C ishrab_v3/app/llama.cpp fetch --depth 1 origin 6eddde06a4f25d55d538b5d15628dcc2b6882147
          git -C ishrab_v3/app/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C ishrab_v3/app/llama.cpp rev-parse HEAD)" = "6eddde06a4f25d55d538b5d15628dcc2b6882147"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h')
          s=p.read_text()
          old='''static inline int ai_should_log(int prio) {
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          }'''
          new='''static inline int ai_should_log(int prio) {
          #if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif
          }'''
          if old not in s:
              raise SystemExit('Expected llama.cpp logging function was not found')
          p.write_text(s.replace(old,new))
          PY
          grep -q '__ANDROID_API__ >= 30' ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h

      - name: Set up Android SDK NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/ishrab-adaptive-v7.jks" \
            -storepass AdaptiveV7_2026X \
            -alias adaptivev7 \
            -keypass AdaptiveV7_2026X \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Ishrab Adaptive Health AI V7,O=Local,C=JO"

      - name: Build signed V7 APK
        id: build
        continue-on-error: true
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/ishrab-adaptive-v7.jks
          SIGN_STORE_PASSWORD: AdaptiveV7_2026X
          SIGN_KEY_ALIAS: adaptivev7
          SIGN_KEY_PASSWORD: AdaptiveV7_2026X
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5120m
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v7.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-v7-build-log
          path: |
            prepare-v7.log
            prepare-v6-for-v7.log
            train-v6.log
            knowledge-v7.log
            build-v7.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature knowledge and native runtime
        shell: bash
        run: |
          set -euxo pipefail
          APK='ishrab_v3/app/build/outputs/apk/release/app-release.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-unzip-test.txt
          unzip -l "$APK" | tee apk-files.txt
          grep -F 'assets/medical_knowledge_100k.db' apk-files.txt
          grep -F 'assets/local_health_ai_v2.json' apk-files.txt
          grep -F 'assets/THIRD_PARTY_NOTICES.txt' apk-files.txt
          grep -F 'lib/arm64-v8a/libai-chat.so' apk-files.txt
          if grep -E '\.gguf([[:space:]]|$)' apk-files.txt; then
            echo 'GGUF must not be bundled in downloadable APK' >&2
            exit 1
          fi
          unzip -p "$APK" assets/medical_knowledge_100k.db > embedded-knowledge.db
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('embedded-knowledge.db')
          assert con.execute('select count(*) from knowledge').fetchone()[0] == 100000
          assert con.execute('select count(*) from knowledge_fts').fetchone()[0] == 100000
          meta=dict(con.execute('select key,value from metadata'))
          assert meta['knowledge_count']=='100000'
          rows=con.execute("select k.source,k.evidence from knowledge_fts f join knowledge k on k.id=f.docid where knowledge_fts match 'diabetes OR glucose' limit 5").fetchall()
          assert rows and all(x[0] and x[1] for x in rows)
          print('embedded 100K knowledge DB verified', meta)
          con.close()
          PY
          "$AAPT2" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.ishrab.smarthealth.ai.v7' versionCode='7' versionName='7.0'" apk-badging.txt
          grep -F "sdkVersion:'23'" apk-badging.txt
          grep -F "targetSdkVersion:'35'" apk-badging.txt
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          grep -F 'android.permission.INTERNET' apk-permissions.txt
          grep -F 'Qwen3-0.6B-Q8_0.gguf' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '639_446_688L' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          sha256sum "$APK" > apk.sha256
          stat -c '%s' "$APK" > apk.size
          ls -lh "$APK"

      - name: Upload V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-adaptive-health-ai-v7-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload V7 verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-adaptive-health-ai-v7-metadata
          path: |
            apk.sha256
            apk.size
            knowledge-db.sha256
            knowledge-db.size
            ishrab_v3/app/src/main/assets/medical_knowledge_100k.db.metadata.json
            apk-signature.txt
            apk-unzip-test.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: warn
          retention-days: 7
