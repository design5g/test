name: Build Fast Health AI V8 Final APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recreate V8 source and audit fast architecture
        shell: bash
        run: |
          set -euxo pipefail
          bash water-build-v7/prepare_v7.sh 2>&1 | tee prepare-v8.log
          cp water-build-v8/FastMedicalQuery.java ishrab_v3/app/src/main/java/com/ishrab/smarthealth/FastMedicalQuery.java
          python3 water-build-v8/apply_v8.py ishrab_v3 | tee transform-v8.log

          cat > ishrab_v3/app/src/main/assets/THIRD_PARTY_NOTICES.txt <<'EOF'
          Ishrab Fast Health AI V8 — Third-Party Notices

          1) MedQuAD
          Dataset: Medical Question Answering Dataset (MedQuAD)
          Authors/reference: Asma Ben Abacha and Dina Demner-Fushman, "A Question-Entailment Approach to Question Answering", BMC Bioinformatics (2019).
          Repository: abachaa/MedQuAD
          License: Creative Commons Attribution 4.0 International (CC BY 4.0).
          This application packages a derived local retrieval index built only from MedQuAD records containing non-empty source answers. The index contains canonical QA and source-grounded answer evidence chunks. It does not synthesize new medical claims during index construction.

          2) LFM2.5-350M-GGUF
          Model: LiquidAI/LFM2.5-350M-GGUF, LFM2.5-350M-Q4_0.gguf
          Model card license field: other. Review the official LiquidAI model repository and license before redistribution outside this application workflow.
          The model is not bundled in the APK. The app can download and checksum-verify the exact model file during optional one-time AI setup, after which inference runs on-device.

          3) llama.cpp
          Project: ggml-org/llama.cpp
          License: MIT License.
          A pinned llama.cpp source revision is compiled into the Android native inference runtime.

          This application is a tracking and educational assistant. It is not a substitute for clinical diagnosis, emergency care, or clinician-directed treatment.
          EOF

          grep -F "applicationId 'com.ishrab.smarthealth.ai.v8'" ishrab_v3/app/build.gradle
          grep -F "versionCode 8" ishrab_v3/app/build.gradle
          grep -F "versionName '8.0'" ishrab_v3/app/build.gradle
          grep -F 'LFM2.5-350M-Q4_0.gguf' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '219_309_792L' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F 'FastMedicalQuery.build' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          grep -F '), 256)' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          grep -F 'DIRECT RESPONSE MODE' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          if grep -Fq 'makeRetrievalQuery' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java; then
            echo 'Old second-LLM retrieval query path still exists' >&2
            exit 1
          fi
          grep -F 'Math.min(2,result.evidence.size())' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/MainActivity.java
          grep -F 'المساعد الصحي السريع V8' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/MainActivity.java
          sha256sum water-build-v8/apply_v8.py water-build-v8/FastMedicalQuery.java | tee v8-source-tools.sha256

      - name: Fetch pinned MedQuAD and build 100K evidence DB
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/abachaa/MedQuAD.git medquad
          git -C medquad fetch --depth 1 origin 577bd37b96c02d1833b2c9eed2de9f96964e96cb
          git -C medquad checkout --detach FETCH_HEAD
          test "$(git -C medquad rev-parse HEAD)" = '577bd37b96c02d1833b2c9eed2de9f96964e96cb'
          DB='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          python3 water-build-v7/build_medical_knowledge.py medquad "$DB" | tee knowledge-v8.log
          python3 - <<'PY'
          import sqlite3
          db='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          con=sqlite3.connect(db)
          assert con.execute('select count(*) from knowledge').fetchone()[0] == 100000
          assert con.execute('select count(*) from knowledge_fts').fetchone()[0] == 100000
          meta=dict(con.execute('select key,value from metadata'))
          assert meta['dataset']=='MedQuAD'
          assert meta['knowledge_count']=='100000'
          rows=con.execute("select k.source,k.evidence from knowledge_fts f join knowledge k on k.id=f.docid where knowledge_fts match 'diabetes OR glucose' limit 5").fetchall()
          assert rows and all(x[0] and x[1] for x in rows)
          print('V8 knowledge audit passed', meta)
          con.close()
          PY
          sha256sum "$DB" | tee knowledge-db.sha256
          stat -c '%s' "$DB" | tee knowledge-db.size

      - name: Audit official LFM2.5 350M Q4_0 model metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee lfm2-model-audit.txt
          import json, urllib.request
          url='https://huggingface.co/api/models/LiquidAI/LFM2.5-350M-GGUF?blobs=true'
          with urllib.request.urlopen(url, timeout=90) as r:
              info=json.load(r)
          expected_repo='bb7ee58b243e4cede04187e323e760b04f8a0091'
          expected_name='LFM2.5-350M-Q4_0.gguf'
          expected_size=219309792
          expected_sha='85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50'
          assert info['sha']==expected_repo, (info['sha'], expected_repo)
          match=[x for x in info['siblings'] if x.get('rfilename')==expected_name]
          assert len(match)==1
          lfs=match[0]['lfs']
          assert lfs['size']==expected_size, lfs
          assert lfs['sha256']==expected_sha, lfs
          print('repository',info['id'])
          print('repository_sha',info['sha'])
          print('file',expected_name)
          print('bytes',lfs['size'])
          print('sha256',lfs['sha256'])
          print('gated',info.get('gated'),'private',info.get('private'))
          print('license',(info.get('cardData') or {}).get('license'))
          PY

      - name: Fetch pinned llama.cpp native runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ishrab_v3/app/llama.cpp
          git -C ishrab_v3/app/llama.cpp init
          git -C ishrab_v3/app/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C ishrab_v3/app/llama.cpp fetch --depth 1 origin 657e01125aa49577a62a5531fde24cbcc007006d
          git -C ishrab_v3/app/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C ishrab_v3/app/llama.cpp rev-parse HEAD)" = '657e01125aa49577a62a5531fde24cbcc007006d'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h')
          s=p.read_text()
          call='return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);'
          if call in s and '__ANDROID_API__ >= 30' not in s:
              repl='''#if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif'''
              p.write_text(s.replace(call,repl))
              print('patched Android 6 log compatibility')
          else:
              print('logging compatibility patch not required or already present')
          PY

      - name: Set up Android SDK NDK CMake and Gradle
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/ishrab-fast-v8.jks" \
            -storepass FastV8_2026X \
            -alias fastv8 \
            -keypass FastV8_2026X \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Ishrab Fast Health AI V8,O=Local,C=JO'

      - name: Build signed V8 APK
        id: build
        continue-on-error: true
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/ishrab-fast-v8.jks
          SIGN_STORE_PASSWORD: FastV8_2026X
          SIGN_KEY_ALIAS: fastv8
          SIGN_KEY_PASSWORD: FastV8_2026X
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5120m
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v8.log"

      - name: Upload V8 build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-v8-build-log
          path: |
            prepare-v8.log
            transform-v8.log
            train-v6.log
            knowledge-v8.log
            lfm2-model-audit.txt
            build-v8.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Strict final V8 verification
        shell: bash
        run: |
          set -euxo pipefail
          APK='ishrab_v3/app/build/outputs/apk/release/app-release.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          unzip -t "$APK" | tee apk-unzip-test.txt
          unzip -l "$APK" | tee apk-files.txt
          grep -F 'assets/medical_knowledge_100k.db' apk-files.txt
          grep -F 'assets/local_health_ai_v2.json' apk-files.txt
          grep -F 'assets/THIRD_PARTY_NOTICES.txt' apk-files.txt
          grep -F 'lib/arm64-v8a/libai-chat.so' apk-files.txt
          if grep -E '\.gguf([[:space:]]|$)' apk-files.txt; then
            echo 'GGUF must not be bundled in downloadable APK' >&2
            exit 1
          fi
          unzip -p "$APK" assets/medical_knowledge_100k.db > embedded-knowledge.db
          python3 - <<'PY'
          import sqlite3
          con=sqlite3.connect('embedded-knowledge.db')
          assert con.execute('select count(*) from knowledge').fetchone()[0] == 100000
          assert con.execute('select count(*) from knowledge_fts').fetchone()[0] == 100000
          meta=dict(con.execute('select key,value from metadata'))
          assert meta['knowledge_count']=='100000'
          print('embedded 100K DB verified',meta)
          con.close()
          PY
          "$AAPT2" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.ishrab.smarthealth.ai.v8' versionCode='8' versionName='8.0'" apk-badging.txt
          grep -F "minSdkVersion:'23'" apk-badging.txt
          grep -F "targetSdkVersion:'35'" apk-badging.txt
          "$AAPT2" dump permissions "$APK" | tee apk-permissions.txt
          grep -F 'android.permission.INTERNET' apk-permissions.txt
          grep -F 'LFM2.5-350M-Q4_0.gguf' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '219_309_792L' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '85e32858daafad55b7bcd6b97a1343ee0661188e8036f9862d14d6b563142f50' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F 'FastMedicalQuery.build' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          grep -F 'DIRECT RESPONSE MODE' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          if grep -Fq 'makeRetrievalQuery' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java; then exit 1; fi
          sha256sum "$APK" | tee apk.sha256
          stat -c '%s' "$APK" | tee apk.size
          ls -lh "$APK"

      - name: Upload final V8 APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-fast-health-ai-v8-final-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload final V8 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-fast-health-ai-v8-final-audit
          path: |
            apk.sha256
            apk.size
            knowledge-db.sha256
            knowledge-db.size
            lfm2-model-audit.txt
            v8-source-tools.sha256
            apk-signature.txt
            apk-unzip-test.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: warn
          retention-days: 7
