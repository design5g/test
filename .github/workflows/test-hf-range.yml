name: Test Model Mirrors
on:
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe public mirrors
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > mirror.log
          success=0
          urls=(
            'https://hf-mirror.com/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf'
            'https://www.modelscope.cn/models/Qwen/Qwen3-0.6B-GGUF/resolve/master/Qwen3-0.6B-Q8_0.gguf'
            'https://modelscope.cn/models/Qwen/Qwen3-0.6B-GGUF/resolve/master/Qwen3-0.6B-Q8_0.gguf'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "=== mirror $i: $url ===" | tee -a mirror.log
            rm -f "part-$i.bin" "headers-$i.txt"
            curl -L --fail --show-error --connect-timeout 30 --max-time 240 \
              --range 0-1048575 -D "headers-$i.txt" -o "part-$i.bin" "$url" \
              >> mirror.log 2>&1
            code=$?
            size=$(stat -c%s "part-$i.bin" 2>/dev/null || echo 0)
            echo "exit=$code size=$size" | tee -a mirror.log
            cat "headers-$i.txt" >> mirror.log 2>/dev/null
            if [ "$code" = 0 ] && [ "$size" = 1048576 ]; then
              echo "WORKING_MIRROR=$url" | tee -a mirror.log
              success=1
              break
            fi
          done
          test "$success" = 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-mirror-probe
          path: |
            mirror.log
            headers-*.txt
          if-no-files-found: warn
      - if: steps.probe.outcome == 'failure'
        run: exit 1
