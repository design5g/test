name: Test HF Range
on:
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test one range
        id: range
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          URL='https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf?download=true&range_probe=1'
          curl -L --fail --show-error --connect-timeout 30 --max-time 180 --range 0-1048575 -D headers.txt -o first.bin "$URL" 2>&1 | tee range.log
          wc -c first.bin | tee -a range.log
          cat headers.txt >> range.log
          test "$(wc -c < first.bin)" = '1048576'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-range-probe
          path: |
            range.log
            headers.txt
          if-no-files-found: warn
      - if: steps.range.outcome == 'failure'
        run: exit 1
