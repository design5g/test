name: Build OPUS English-Arabic INT8

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU conversion dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install \
            'ctranslate2==4.8.1' \
            'transformers>=4.41,<5' \
            'sentencepiece>=0.2,<1' \
            'sacremoses>=0.1,<1' \
            'safetensors>=0.4,<1'

      - name: Download, convert, quantize, and validate model
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          cat > build_model.py <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path

          import ctranslate2
          from transformers import AutoTokenizer

          MODEL_ID = 'Helsinki-NLP/opus-mt-en-ar'
          OUTPUT = Path('opus-mt-en-ar-int8').resolve()
          TOKENIZER_DIR = OUTPUT / 'tokenizer'

          if OUTPUT.exists():
              shutil.rmtree(OUTPUT)

          converter = shutil.which('ct2-transformers-converter')
          if not converter:
              raise RuntimeError('ct2-transformers-converter is unavailable')

          subprocess.run(
              [
                  converter,
                  '--model', MODEL_ID,
                  '--output_dir', str(OUTPUT),
                  '--quantization', 'int8',
                  '--force',
              ],
              check=True,
          )

          tokenizer = AutoTokenizer.from_pretrained(MODEL_ID)
          tokenizer.save_pretrained(TOKENIZER_DIR)

          metadata = {
              'model_id': MODEL_ID,
              'locale': 'ar',
              'engine': 'opus',
              'license': 'Apache-2.0',
              'commercial_use': True,
              'quantization': 'int8',
              'recommended_target_prefix': '>>ara<<',
              'ctranslate2_version': ctranslate2.__version__,
          }
          (OUTPUT / 'easa_model_meta.json').write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (OUTPUT / 'MODEL_LICENSE.txt').write_text(
              'Source model: Helsinki-NLP/opus-mt-en-ar\n'
              'License: Apache License 2.0\n'
              'Source: https://huggingface.co/Helsinki-NLP/opus-mt-en-ar\n',
              encoding='utf-8',
          )

          required = [OUTPUT / 'model.bin', OUTPUT / 'config.json', TOKENIZER_DIR]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise RuntimeError(f'Missing required output: {missing}')

          translator = ctranslate2.Translator(
              str(OUTPUT),
              device='cpu',
              compute_type='int8',
              inter_threads=1,
              intra_threads=2,
          )
          local_tokenizer = AutoTokenizer.from_pretrained(
              str(TOKENIZER_DIR), local_files_only=True
          )
          sample = '>>ara<< This is a translation test.'
          source_tokens = local_tokenizer.convert_ids_to_tokens(
              local_tokenizer.encode(sample)
          )
          result = translator.translate_batch(
              [source_tokens], beam_size=2, max_decoding_length=128
          )[0]
          output_ids = local_tokenizer.convert_tokens_to_ids(result.hypotheses[0])
          translated = local_tokenizer.decode(output_ids, skip_special_tokens=True)
          if not translated.strip():
              raise RuntimeError('Validation translation returned empty output')
          print('Validation translation:', translated)

          archive = Path(
              shutil.make_archive(
                  'opus-mt-en-ar-int8',
                  'zip',
                  root_dir='.',
                  base_dir=OUTPUT.name,
              )
          ).resolve()
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          Path(str(archive) + '.sha256').write_text(
              f'{digest}  {archive.name}\n', encoding='utf-8'
          )
          print('Archive:', archive)
          print('Archive size:', archive.stat().st_size)
          print('SHA-256:', digest)
          PY

          python build_model.py

      - name: Upload ready cPanel model
        uses: actions/upload-artifact@v4
        with:
          name: opus-mt-en-ar-int8-ready
          path: |
            opus-mt-en-ar-int8.zip
            opus-mt-en-ar-int8.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
