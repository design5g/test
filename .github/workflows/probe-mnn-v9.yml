name: Probe MNN V9 Runtime

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official MNN Chat 0.8.3 APK
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -o mnn-chat-0.8.3.apk \
            https://meta.alicdn.com/data/mnn/apks/mnn_chat_0_8_3.apk
          sha256sum mnn-chat-0.8.3.apk | tee mnn-apk.sha256
          unzip -l mnn-chat-0.8.3.apk | grep 'lib/arm64-v8a/.*\.so' | tee mnn-arm64-libs.txt
          mkdir -p mnn-apk
          unzip -q mnn-chat-0.8.3.apk 'lib/arm64-v8a/*' -d mnn-apk
          for f in mnn-apk/lib/arm64-v8a/*.so; do
            echo "===== $f ====="
            readelf -d "$f" | grep NEEDED || true
          done | tee mnn-needed.txt
      - name: Inspect official MNN LFM2.5 package
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY' | tee lfm25-mnn-files.txt
          from huggingface_hub import HfApi
          repo='taobao-mnn/LFM2.5-1.2B-Instruct-MNN'
          info=HfApi().model_info(repo, files_metadata=True)
          print('repo', repo)
          print('sha', info.sha)
          print('license', getattr(info.card_data, 'license', None) if info.card_data else None)
          total=0
          for s in info.siblings:
              size=getattr(s,'size',None)
              print('FILE',s.rfilename,'SIZE',size,'BLOB',getattr(s,'blob_id',None),'LFS',getattr(s,'lfs',None))
              if size: total += size
          print('TOTAL_BYTES',total)
          PY
      - name: Inspect official JNI/runtime build linkage
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/alibaba/MNN.git MNN
          git -C MNN rev-parse HEAD | tee mnn-source-commit.txt
          sed -n '1,180p' MNN/apps/Android/MnnLlmChat/app/src/main/cpp/CMakeLists.txt > mnn-cmake.txt
          grep -nE 'target_link_libraries|add_library|find_library|LIB_PATH|libMNN|llm' MNN/apps/Android/MnnLlmChat/app/src/main/cpp/CMakeLists.txt | tee mnn-cmake-linkage.txt
          grep -nE 'Java_.*Llm|createLLM|set_config|load\(|response\(|syncPromptCache|generate\(1\)' MNN/apps/Android/MnnLlmChat/app/src/main/cpp/llm_mnn_jni.cpp MNN/apps/Android/MnnLlmChat/app/src/main/cpp/llm_session.cpp | head -250 | tee mnn-jni-api.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mnn-v9-probe
          path: |
            mnn-apk.sha256
            mnn-arm64-libs.txt
            mnn-needed.txt
            lfm25-mnn-files.txt
            mnn-source-commit.txt
            mnn-cmake.txt
            mnn-cmake-linkage.txt
            mnn-jni-api.txt
          retention-days: 3
