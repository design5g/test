name: Build Smart Health APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate Android project
        id: recreate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee reconstruct-v3.log) 2>&1
          ls -l water-build/chunk_*.b64
          wc -c water-build/chunk_*.b64
          sha256sum water-build/chunk_*.b64
          cat water-build/chunk_*.b64 > ishrab_v3.tar.gz.b64
          wc -c ishrab_v3.tar.gz.b64
          base64 -d ishrab_v3.tar.gz.b64 > ishrab_v3.tar.gz
          wc -c ishrab_v3.tar.gz
          gzip -t ishrab_v3.tar.gz
          tar -xzf ishrab_v3.tar.gz
          patch -p1 -d ishrab_v3 < water-build/v3-fix.patch
          test -f ishrab_v3/app/build.gradle
          tar -czf ishrab_v3_patched_source.tar.gz ishrab_v3

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-reconstruct-log
          path: reconstruct-v3.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed reconstruction
        if: steps.recreate.outcome == 'failure'
        run: exit 1

      - name: Upload patched source archive
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-v3-source
          path: ishrab_v3_patched_source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Set up Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/smart-health-release.jks" \
            -storepass SmartHealth2026X \
            -alias smarthealth \
            -keypass SmartHealth2026X \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ishrab Smart Health,O=Local,C=JO"

      - name: Build signed release APK
        id: build
        continue-on-error: true
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/smart-health-release.jks
          SIGN_STORE_PASSWORD: SmartHealth2026X
          SIGN_KEY_ALIAS: smarthealth
          SIGN_KEY_PASSWORD: SmartHealth2026X
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v3.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-build-log
          path: build-v3.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs ishrab_v3/app/build/outputs/apk/release/app-release.apk
          unzip -t ishrab_v3/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-v3-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
