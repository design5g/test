name: Build Smart Health Qwen V5 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate V4 base and apply V5 patch
        id: recreate
        continue-on-error: true
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee reconstruct-v5.log) 2>&1
          cat water-build/chunk_*.b64 > ishrab_v3.tar.gz.b64
          base64 -d ishrab_v3.tar.gz.b64 > ishrab_v3.tar.gz
          gzip -t ishrab_v3.tar.gz
          tar -xzf ishrab_v3.tar.gz
          patch -p1 -d ishrab_v3 < water-build/v3-fix.patch

          cat water-build/v4fix06hex_0.txt water-build/v4fix06hex_1.txt | tr -d '\r\n ' | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' > corrected-06.b64
          test "$(wc -c < corrected-06.b64)" = "4000"
          : > v4-ai.patch.gz.b64
          for i in $(seq -w 0 19); do
            f="water-build/v4ai_${i}.b64"
            if [ "$i" = "06" ]; then f="corrected-06.b64"; fi
            tr -d '\r\n ' < "$f" >> v4-ai.patch.gz.b64
          done
          test "$(wc -c < v4-ai.patch.gz.b64)" = "76216"
          base64 -d v4-ai.patch.gz.b64 > v4-ai.patch.gz
          gzip -t v4-ai.patch.gz
          gzip -dc v4-ai.patch.gz > v4-ai.patch
          test "$(sha256sum v4-ai.patch | awk '{print $1}')" = "5522d79bed4abd2fd8ad784546ccc937ffb0da6780f39b589fd968118f00fb24"
          patch -p1 -d ishrab_v3 < v4-ai.patch

          cat water-build-v5/v5rel_*.b64 | tr -d '\r\n ' > v5.patch.gz.b64
          test "$(wc -c < v5.patch.gz.b64)" = "18324"
          test "$(sha256sum v5.patch.gz.b64 | awk '{print $1}')" = "ebd69d994e4287c313db135822670a0d5291c33c06e6ee2087e082597a95c2bf"
          base64 -d v5.patch.gz.b64 > v5.patch.gz
          gzip -t v5.patch.gz
          gzip -dc v5.patch.gz > v5.patch
          test "$(sha256sum v5.patch | awk '{print $1}')" = "f74a387d340fe47a2ae64edb7200fcb50445122b70ecf19e96b7aef30b00be11"
          patch -p1 -d ishrab_v3 < v5.patch
          test -f ishrab_v3/app/src/main/java/com/ishrab/smarthealth/RealLlmEngine.java
          test -f ishrab_v3/app/src/main/java/com/ishrab/smarthealth/QuickStatusNotification.java
          test -f ishrab_v3/app/src/main/cpp/CMakeLists.txt
          grep -q "com.ishrab.smarthealth.ai.llm" ishrab_v3/app/build.gradle

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-v5-reconstruct-log
          path: reconstruct-v5.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed reconstruction
        if: steps.recreate.outcome == 'failure'
        run: exit 1

      - name: Fetch pinned llama.cpp Android runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ishrab_v3/app/llama.cpp
          git -C ishrab_v3/app/llama.cpp init
          git -C ishrab_v3/app/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C ishrab_v3/app/llama.cpp fetch --depth 1 origin 6eddde06a4f25d55d538b5d15628dcc2b6882147
          git -C ishrab_v3/app/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C ishrab_v3/app/llama.cpp rev-parse HEAD)" = "6eddde06a4f25d55d538b5d15628dcc2b6882147"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h')
          s = p.read_text()
          old = '''static inline int ai_should_log(int prio) {
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          }'''
          new = '''static inline int ai_should_log(int prio) {
          #if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif
          }'''
          if old not in s:
              raise SystemExit('Expected llama.cpp logging function was not found')
          p.write_text(s.replace(old, new))
          PY
          grep -q "__ANDROID_API__ >= 30" ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h

      - name: Download and verify official Qwen model
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '1200'
          HF_HUB_ETAG_TIMEOUT: '60'
        run: |
          set -euxo pipefail
          exec > >(tee model-download-v5.log) 2>&1
          python3 -m pip install --disable-pip-version-check --quiet "huggingface_hub>=0.33"
          ASSET_DIR="$GITHUB_WORKSPACE/ishrab_v3/app/src/main/assets"
          MODEL="$ASSET_DIR/Qwen3-0.6B-Q8_0.gguf"
          mkdir -p "$ASSET_DIR"
          success=0
          for attempt in 1 2 3 4 5; do
            echo "Model download attempt $attempt"
            if python3 - <<'PY'
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='Qwen/Qwen3-0.6B-GGUF',
              filename='Qwen3-0.6B-Q8_0.gguf',
              local_dir='ishrab_v3/app/src/main/assets',
              force_download=True,
          )
          print(path)
          PY
            then
              success=1
              break
            fi
            sleep 15
          done
          test "$success" = "1"
          test -f "$MODEL"
          test "$(sha256sum "$MODEL" | awk '{print $1}')" = "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"
          test "$(stat -c%s "$MODEL")" = "639446688"
          test ! -d "${MODEL}.parts"
          ls -lh "$MODEL"

      - name: Upload model transfer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-v5-model-download-log
          path: model-download-v5.log
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Android SDK, NDK and CMake
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/smart-health-qwen-v5.jks" -storepass SmartQwenV5_2026X -alias smartqwen -keypass SmartQwenV5_2026X -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ishrab Smart Health Qwen,O=Local,C=JO"

      - name: Build signed V5 release APK
        id: build
        continue-on-error: true
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/smart-health-qwen-v5.jks
          SIGN_STORE_PASSWORD: SmartQwenV5_2026X
          SIGN_KEY_ALIAS: smartqwen
          SIGN_KEY_PASSWORD: SmartQwenV5_2026X
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5120m
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v5.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-v5-build-log
          path: build-v5.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify signature, model and native runtime
        shell: bash
        run: |
          set -euxo pipefail
          APK="ishrab_v3/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "assets/Qwen3-0.6B-Q8_0.gguf"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libai-chat.so"
          unzip -p "$APK" assets/Qwen3-0.6B-Q8_0.gguf | sha256sum | grep -F "9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031"
          ls -lh "$APK"

      - name: Split verified APK for transfer
        shell: bash
        run: |
          set -euxo pipefail
          APK="ishrab_v3/app/build/outputs/apk/release/app-release.apk"
          mkdir -p apk-transfer
          split -b 300000000 -d -a 2 "$APK" apk-transfer/ishrab-smart-health-qwen-v5.apk.part-
          test -f apk-transfer/ishrab-smart-health-qwen-v5.apk.part-00
          test -f apk-transfer/ishrab-smart-health-qwen-v5.apk.part-01
          test -f apk-transfer/ishrab-smart-health-qwen-v5.apk.part-02
          test ! -f apk-transfer/ishrab-smart-health-qwen-v5.apk.part-03
          sha256sum "$APK" > apk-transfer/apk.sha256
          stat -c '%s' "$APK" > apk-transfer/apk.size
          sha256sum apk-transfer/ishrab-smart-health-qwen-v5.apk.part-* > apk-transfer/parts.sha256
          ls -lh apk-transfer

      - name: Upload APK part 00
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v5-apk-part-00
          path: apk-transfer/ishrab-smart-health-qwen-v5.apk.part-00
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK part 01
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v5-apk-part-01
          path: apk-transfer/ishrab-smart-health-qwen-v5.apk.part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK part 02
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v5-apk-part-02
          path: apk-transfer/ishrab-smart-health-qwen-v5.apk.part-02
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload APK metadata
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v5-apk-metadata
          path: |
            apk-transfer/apk.sha256
            apk-transfer/apk.size
            apk-transfer/parts.sha256
          if-no-files-found: error
          retention-days: 7
