name: Build Water APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate Android project
        shell: bash
        run: |
          cat water-build/chunk_*.b64 > waterapp.tar.gz.b64
          base64 -d waterapp.tar.gz.b64 > waterapp.tar.gz
          tar -xzf waterapp.tar.gz
          test -f waterapp/app/build.gradle

      - name: Set up Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/water-release.jks" \
            -storepass WaterApp2026X \
            -alias water \
            -keypass WaterApp2026X \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ishrab Maa Pro,O=Local,C=JO"

      - name: Build signed release APK
        working-directory: waterapp
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/water-release.jks
          SIGN_STORE_PASSWORD: WaterApp2026X
          SIGN_KEY_ALIAS: water
          SIGN_KEY_PASSWORD: WaterApp2026X
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs waterapp/app/build/outputs/apk/release/app-release.apk
          unzip -t waterapp/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-maa-pro-apk
          path: waterapp/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
