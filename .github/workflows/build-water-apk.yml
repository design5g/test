name: Build Smart Health AI APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Recreate Android AI project
        id: recreate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          exec > >(tee reconstruct-v4-ai.log) 2>&1
          cat water-build/chunk_*.b64 > ishrab_v3.tar.gz.b64
          base64 -d ishrab_v3.tar.gz.b64 > ishrab_v3.tar.gz
          gzip -t ishrab_v3.tar.gz
          tar -xzf ishrab_v3.tar.gz
          patch -p1 -d ishrab_v3 < water-build/v3-fix.patch
          cat water-build/v4fix06hex_0.txt water-build/v4fix06hex_1.txt | tr -d '\r\n ' | python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(sys.stdin.read()))' > corrected-06.b64
          test "$(wc -c < corrected-06.b64)" = "4000"
          : > v4-ai.patch.gz.b64
          for i in $(seq -w 0 19); do
            f="water-build/v4ai_${i}.b64"
            if [ "$i" = "06" ]; then f="corrected-06.b64"; fi
            tr -d '\r\n ' < "$f" >> v4-ai.patch.gz.b64
          done
          test "$(wc -c < v4-ai.patch.gz.b64)" = "76216"
          sha256sum v4-ai.patch.gz.b64
          base64 -d v4-ai.patch.gz.b64 > v4-ai.patch.gz
          gzip -t v4-ai.patch.gz
          gzip -dc v4-ai.patch.gz > v4-ai.patch
          sha256sum v4-ai.patch
          test "$(sha256sum v4-ai.patch | awk '{print $1}')" = "5522d79bed4abd2fd8ad784546ccc937ffb0da6780f39b589fd968118f00fb24"
          patch -p1 -d ishrab_v3 < v4-ai.patch
          test -f ishrab_v3/app/src/main/java/com/ishrab/smarthealth/LocalAiEngine.java
          test -f ishrab_v3/app/src/main/assets/local_health_ai_v1.json
          grep -q "com.ishrab.smarthealth.ai" ishrab_v3/app/build.gradle
          tar -czf ishrab_v4_ai_source.tar.gz ishrab_v3

      - name: Upload reconstruction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-ai-reconstruct-log
          path: reconstruct-v4-ai.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed reconstruction
        if: steps.recreate.outcome == 'failure'
        run: exit 1

      - name: Upload AI source archive
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-ai-v4-source
          path: ishrab_v4_ai_source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Set up Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create release signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/smart-health-ai-release.jks" \
            -storepass SmartHealthAI2026X \
            -alias smarthealthai \
            -keypass SmartHealthAI2026X \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ishrab Smart Health AI,O=Local,C=JO"

      - name: Build signed AI release APK
        id: build
        continue-on-error: true
        working-directory: ishrab_v3
        shell: bash
        env:
          SIGN_STORE_FILE: ${{ github.workspace }}/smart-health-ai-release.jks
          SIGN_STORE_PASSWORD: SmartHealthAI2026X
          SIGN_KEY_ALIAS: smarthealthai
          SIGN_KEY_PASSWORD: SmartHealthAI2026X
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v4-ai.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-health-ai-build-log
          path: build-v4-ai.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after failed compilation
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify APK signature and archive
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs ishrab_v3/app/build/outputs/apk/release/app-release.apk
          unzip -t ishrab_v3/app/build/outputs/apk/release/app-release.apk
          unzip -l ishrab_v3/app/build/outputs/apk/release/app-release.apk | grep -q local_health_ai_v1.json

      - name: Upload AI APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-smart-health-ai-v4-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
