name: Train Ishrab V10 Clinical Atlas

on:
  push:
    branches: [build/ishrab-mind-v10]
    paths:
      - '.ci-trigger-v10'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/ishrab-mind-v10
      - name: Train verified UCI diabetes clinical case atlas
        run: |
          cat > /tmp/train_atlas.py <<'PY'
          from __future__ import annotations
          import csv, hashlib, io, json, urllib.request, zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          URL = 'https://h2o-public-test-data.s3.amazonaws.com/smalldata/diabetes/dataset_diabetes.zip'
          EXPECTED_ROWS = 101_766
          MEDS = ['metformin','repaglinide','nateglinide','chlorpropamide','glimepiride','acetohexamide','glipizide','glyburide','tolbutamide','pioglitazone','rosiglitazone','acarbose','miglitol','troglitazone','tolazamide','examide','citoglipton','insulin','glyburide-metformin','glipizide-metformin','glimepiride-pioglitazone','metformin-rosiglitazone','metformin-pioglitazone']

          raw = urllib.request.urlopen(URL, timeout=120).read()
          digest = hashlib.sha256(raw).hexdigest()
          zf = zipfile.ZipFile(io.BytesIO(raw))
          name = next(n for n in zf.namelist() if n.endswith('diabetic_data.csv'))
          rows = list(csv.DictReader(io.TextIOWrapper(zf.open(name), encoding='utf-8', newline='')))
          if len(rows) != EXPECTED_ROWS:
              raise SystemExit(f'row count mismatch: {len(rows)} != {EXPECTED_ROWS}')
          required = ['patient_nbr','age','A1Cresult','max_glu_serum','readmitted','change','diabetesMed','number_emergency','number_inpatient','number_outpatient',*MEDS]
          missing = [x for x in required if x not in rows[0]]
          if missing:
              raise SystemExit(f'missing columns: {missing}')

          def med_state(v): return {'No':0,'Steady':1,'Up':2,'Down':3}.get(v,0)
          def age_bin(v):
              try: return int(v[1:v.index('-')]) // 10
              except Exception: return -1
          def a1c(v): return {'None':0,'Norm':1,'>7':2,'>8':3}.get(v,0)
          def glu(v): return {'None':0,'Norm':1,'>200':2,'>300':3}.get(v,0)
          def visit_bin(v):
              try: n=int(v)
              except Exception: n=0
              return 0 if n==0 else 1 if n==1 else 2 if n<=3 else 3
          def oral_count(r): return sum(1 for m in MEDS if m != 'insulin' and r[m] != 'No')
          def oral_bin(n): return 0 if n==0 else 1 if n==1 else 2 if n<=3 else 3

          groups = defaultdict(lambda: {'n':0,'lt30':0,'any':0,'emerg':0,'inpat':0,'outpat':0,'patients':set(),'meds':Counter()})
          all_patients=set(); all_meds=Counter(); early=0; any_readm=0
          for r in rows:
              key=(age_bin(r['age']),a1c(r['A1Cresult']),glu(r['max_glu_serum']),med_state(r['insulin']),med_state(r['metformin']),oral_bin(oral_count(r)),1 if r['change']=='Ch' else 0,visit_bin(r['number_emergency']),visit_bin(r['number_inpatient']))
              g=groups[key]; g['n']+=1
              pid=r['patient_nbr']; g['patients'].add(pid); all_patients.add(pid)
              if r['readmitted']=='<30': g['lt30']+=1; early+=1
              if r['readmitted']!='NO': g['any']+=1; any_readm+=1
              g['emerg']+=int(r['number_emergency']); g['inpat']+=int(r['number_inpatient']); g['outpat']+=int(r['number_outpatient'])
              for m in MEDS:
                  if r[m] != 'No': g['meds'][m]+=1; all_meds[m]+=1

          selected=sorted(((k,v) for k,v in groups.items() if v['n']>=80),key=lambda kv:kv[1]['n'],reverse=True)[:180]
          atlas=[]
          for k,g in selected:
              atlas.append({'f':list(k),'n':g['n'],'p':len(g['patients']),'r30':round(g['lt30']/g['n'],6),'rany':round(g['any']/g['n'],6),'em':round(g['emerg']/g['n'],4),'ip':round(g['inpat']/g['n'],4),'op':round(g['outpat']/g['n'],4),'topMeds':[x for x,_ in g['meds'].most_common(5)]})

          out=Path('generated'); out.mkdir(exist_ok=True)
          payload={'schema':1,'source':'UCI Diabetes 130-US Hospitals for Years 1999-2008','sourceDoi':'10.24432/C5230J','sourceLicense':'CC BY 4.0','datasetUrl':URL,'datasetZipSha256':digest,'encounters':len(rows),'uniquePatients':len(all_patients),'medicationFields':MEDS,'atlasStrata':len(atlas),'globalEarlyReadmissionRate':round(early/len(rows),6),'globalAnyReadmissionRate':round(any_readm/len(rows),6),'topMedicationFields':[x for x,_ in all_meds.most_common(12)],'atlas':atlas}
          (out/'case_atlas.json').write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          report={k:v for k,v in payload.items() if k!='atlas'}
          (out/'training_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          python /tmp/train_atlas.py
      - name: Commit generated verified atlas
        run: |
          git config user.name 'Ishrab Clinical Trainer'
          git config user.email 'actions@users.noreply.github.com'
          git add generated/case_atlas.json generated/training_report.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Generate verified V10 diabetes clinical case atlas'
            git push origin HEAD:build/ishrab-mind-v10
          fi
