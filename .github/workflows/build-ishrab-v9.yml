name: Build Ishrab NeuroCore V9

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore source archive
        run: |
          cat build/ishrab-v9-source.part-* > /tmp/ishrab-v9-source.b64
          base64 -d /tmp/ishrab-v9-source.b64 > /tmp/ishrab-neurocore-v9-source.zip
          unzip -q /tmp/ishrab-neurocore-v9-source.zip -d /tmp/ishrab-v9
          test -f /tmp/ishrab-v9/ishrab-neurocore-v9/app/build.gradle.kts
          sha256sum /tmp/ishrab-neurocore-v9-source.zip

      - name: Unit test and build debug APK
        working-directory: /tmp/ishrab-v9/ishrab-neurocore-v9
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure and permissions
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/ishrab-v9/ishrab-neurocore-v9
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/tmp/unzip-test.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/aapt-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > /tmp/permissions.txt
          ! grep -q 'android.permission.INTERNET' /tmp/permissions.txt
          ! unzip -l "$APK" | grep -Eiq '\.gguf$|libllama|llama\.cpp'
          grep -q "package: name='com.ishrab.neurocore.v9'" /tmp/aapt-badging.txt
          grep -q "versionName='9.0'" /tmp/aapt-badging.txt

      - name: Package verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/ishrab-v9/ishrab-neurocore-v9
          OUT="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUT"
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/ishrab-neurocore-v9-debug.apk"
          cp /tmp/ishrab-neurocore-v9-source.zip "$OUT/ishrab-neurocore-v9-source.zip"
          cp /tmp/aapt-badging.txt /tmp/permissions.txt /tmp/apksigner.txt /tmp/unzip-test.txt "$OUT/"
          cp -r "$ROOT/app/build/test-results/testDebugUnitTest" "$OUT/unit-test-results"
          (
            cd "$OUT"
            sha256sum ishrab-neurocore-v9-debug.apk ishrab-neurocore-v9-source.zip > SHA256SUMS.txt
          )
          python3 - <<'PY'
          import json, pathlib
          out = pathlib.Path('out')
          apk = out / 'ishrab-neurocore-v9-debug.apk'
          src = out / 'ishrab-neurocore-v9-source.zip'
          metadata = {
              'app': 'Ishrab NeuroCore V9',
              'package': 'com.ishrab.neurocore.v9',
              'version_name': '9.0',
              'version_code': 90000,
              'build_type': 'debug-test-signed',
              'apk_bytes': apk.stat().st_size,
              'source_zip_bytes': src.stat().st_size,
              'internet_permission': False,
              'runtime': 'LiteRT-LM 0.14.0 optional local .litertlm import',
              'llama_cpp': False,
              'gguf': False,
              'ci_run': '${{ github.run_id }}',
              'commit': '${{ github.sha }}',
          }
          (out / 'BUILD_METADATA.json').write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Upload installable APK and source
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-neurocore-v9-ready
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
