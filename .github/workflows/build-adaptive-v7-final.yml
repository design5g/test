name: Build Adaptive Health AI V7 Final APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Recreate V7 and build 100K knowledge DB
        shell: bash
        run: |
          set -euxo pipefail
          bash water-build-v7/prepare_v7.sh 2>&1 | tee prepare-v7-final.log
          git clone --filter=blob:none --no-checkout https://github.com/abachaa/MedQuAD.git medquad
          git -C medquad fetch --depth 1 origin 577bd37b96c02d1833b2c9eed2de9f96964e96cb
          git -C medquad checkout --detach FETCH_HEAD
          test "$(git -C medquad rev-parse HEAD)" = "577bd37b96c02d1833b2c9eed2de9f96964e96cb"
          DB='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          python3 water-build-v7/build_medical_knowledge.py medquad "$DB" 2>&1 | tee knowledge-v7-final.log
          python3 - <<'PY'
          import sqlite3
          db='ishrab_v3/app/src/main/assets/medical_knowledge_100k.db'
          c=sqlite3.connect(db)
          assert c.execute('select count(*) from knowledge').fetchone()[0] == 100000
          assert c.execute('select count(*) from knowledge_fts').fetchone()[0] == 100000
          m=dict(c.execute('select key,value from metadata'))
          assert m['knowledge_count']=='100000' and m['dataset']=='MedQuAD' and m['dataset_license']=='CC BY 4.0'
          rows=c.execute("select k.source,k.evidence from knowledge_fts f join knowledge k on k.id=f.docid where knowledge_fts match 'diabetes OR glucose' limit 5").fetchall()
          assert rows and all(a and b for a,b in rows)
          print('100K knowledge audit passed',m)
          c.close()
          PY
          sha256sum "$DB" > knowledge-db.sha256
          stat -c '%s' "$DB" > knowledge-db.size

      - name: Fetch pinned llama.cpp and patch Android 6 logging
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ishrab_v3/app/llama.cpp
          git -C ishrab_v3/app/llama.cpp init
          git -C ishrab_v3/app/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C ishrab_v3/app/llama.cpp fetch --depth 1 origin 6eddde06a4f25d55d538b5d15628dcc2b6882147
          git -C ishrab_v3/app/llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C ishrab_v3/app/llama.cpp rev-parse HEAD)" = "6eddde06a4f25d55d538b5d15628dcc2b6882147"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ishrab_v3/app/llama.cpp/examples/llama.android/lib/src/main/cpp/logging.h')
          s=p.read_text()
          old='''static inline int ai_should_log(int prio) {
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          }'''
          new='''static inline int ai_should_log(int prio) {
          #if __ANDROID_API__ >= 30
              return __android_log_is_loggable(prio, LOG_TAG, LOG_MIN_LEVEL);
          #else
              return prio >= LOG_MIN_LEVEL;
          #endif
          }'''
          if old not in s: raise SystemExit('llama logging hook missing')
          p.write_text(s.replace(old,new))
          PY

      - name: Set up Android NDK CMake and Gradle
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sign and build
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/ishrab-v7-final.jks" -storepass V7Final_2026X -alias v7final -keypass V7Final_2026X -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ishrab Adaptive Health AI V7,O=Local,C=JO"
          cd ishrab_v3
          export SIGN_STORE_FILE="$GITHUB_WORKSPACE/ishrab-v7-final.jks"
          export SIGN_STORE_PASSWORD='V7Final_2026X'
          export SIGN_KEY_ALIAS='v7final'
          export SIGN_KEY_PASSWORD='V7Final_2026X'
          export GRADLE_OPTS='-Dorg.gradle.jvmargs=-Xmx5120m'
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build-v7-final.log"

      - name: Strict final verification
        shell: bash
        run: |
          set -euxo pipefail
          APK='ishrab_v3/app/build/outputs/apk/release/app-release.apk'
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature-final.txt
          unzip -t "$APK" | tee apk-unzip-final.txt
          unzip -l "$APK" | tee apk-files-final.txt
          grep -F 'assets/medical_knowledge_100k.db' apk-files-final.txt
          grep -F 'assets/local_health_ai_v2.json' apk-files-final.txt
          grep -F 'assets/THIRD_PARTY_NOTICES.txt' apk-files-final.txt
          grep -F 'lib/arm64-v8a/libai-chat.so' apk-files-final.txt
          if grep -E '\.gguf([[:space:]]|$)' apk-files-final.txt; then exit 1; fi
          unzip -p "$APK" assets/medical_knowledge_100k.db > embedded-knowledge.db
          python3 - <<'PY'
          import sqlite3
          c=sqlite3.connect('embedded-knowledge.db')
          assert c.execute('select count(*) from knowledge').fetchone()[0]==100000
          assert c.execute('select count(*) from knowledge_fts').fetchone()[0]==100000
          m=dict(c.execute('select key,value from metadata'))
          assert m['knowledge_count']=='100000' and m['dataset_license']=='CC BY 4.0'
          assert c.execute("select count(*) from knowledge_fts where knowledge_fts match 'diabetes OR glucose'").fetchone()[0] > 0
          c.close()
          print('embedded knowledge verified')
          PY
          "$AAPT2" dump badging "$APK" | tee apk-badging-final.txt
          grep -F "package: name='com.ishrab.smarthealth.ai.v7' versionCode='7' versionName='7.0'" apk-badging-final.txt
          grep -F "minSdkVersion:'23'" apk-badging-final.txt
          grep -F "targetSdkVersion:'35'" apk-badging-final.txt
          "$AAPT2" dump permissions "$APK" | tee apk-permissions-final.txt
          grep -F 'android.permission.INTERNET' apk-permissions-final.txt
          grep -F 'MODEL_BYTES = 639_446_688L' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          grep -F '9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031' ishrab_v3/app/src/main/java/com/ishrab/smarthealth/ModelManager.java
          sha256sum "$APK" > apk-final.sha256
          stat -c '%s' "$APK" > apk-final.size
          ls -lh "$APK"

      - name: Upload final V7 APK
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-adaptive-health-ai-v7-final-apk
          path: ishrab_v3/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      - name: Upload final audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-adaptive-health-ai-v7-final-audit
          path: |
            prepare-v7-final.log
            knowledge-v7-final.log
            build-v7-final.log
            knowledge-db.sha256
            knowledge-db.size
            ishrab_v3/app/src/main/assets/medical_knowledge_100k.db.metadata.json
            apk-signature-final.txt
            apk-unzip-final.txt
            apk-badging-final.txt
            apk-permissions-final.txt
            apk-final.sha256
            apk-final.size
          if-no-files-found: warn
          retention-days: 7
