name: Probe LFM2 350M Official Files

on:
  pull_request:
    branches: [ main ]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query official LiquidAI repositories
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet huggingface_hub
          python3 - <<'PY' | tee lfm2-probe.txt
          from huggingface_hub import HfApi
          api=HfApi()
          models=list(api.list_models(author='LiquidAI', search='LFM2-350M', limit=30, full=True))
          for m in models:
              print('MODEL',m.id,'downloads',m.downloads,'private',m.private,'gated',getattr(m,'gated',None))
              try:
                  info=api.model_info(m.id, files_metadata=True)
                  print('sha',info.sha,'license',getattr(info,'card_data',{}).get('license') if getattr(info,'card_data',None) else None)
                  for s in info.siblings:
                      print('FILE',s.rfilename,'size',getattr(s,'size',None),'blob',getattr(s,'blob_id',None))
              except Exception as e:
                  print('ERR',type(e).__name__,str(e))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lfm2-probe
          path: lfm2-probe.txt
          if-no-files-found: error
          retention-days: 3
