name: Export V7 Source

on:
  pull_request:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct V7 source
        shell: bash
        run: |
          set -euxo pipefail
          bash water-build-v7/prepare_v7.sh
          tar -czf ishrab-v7-source.tar.gz ishrab_v3
          sha256sum ishrab-v7-source.tar.gz
          ls -lh ishrab-v7-source.tar.gz
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v7-source
          path: ishrab-v7-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
