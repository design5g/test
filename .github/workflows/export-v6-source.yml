name: Export V6 Source

on:
  pull_request:
    branches: [ main ]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct V6 source
        shell: bash
        run: |
          set -euxo pipefail
          bash water-build-v6/prepare_v6.sh 2>&1 | tee export-v6.log
          tar -czf ishrab-v6-source.tar.gz ishrab_v3
          sha256sum ishrab-v6-source.tar.gz
          ls -lh ishrab-v6-source.tar.gz
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v6-source
          path: ishrab-v6-source.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Upload export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ishrab-v6-export-log
          path: export-v6.log
          if-no-files-found: warn
          retention-days: 3
